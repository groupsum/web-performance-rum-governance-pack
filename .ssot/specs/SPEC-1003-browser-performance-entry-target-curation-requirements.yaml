body: |-
  ## Requirements
  
  Source curation for browser performance entry targets MUST retain Performance Timeline as the shared observation authority.
  
  Source curation MUST retain Navigation Timing, Resource Timing, and User Timing as source-specific performance entry authorities.
  
  Source curation MUST preserve entry family, entry type, buffering, ordering, and observation targets as distinct curated concerns.

