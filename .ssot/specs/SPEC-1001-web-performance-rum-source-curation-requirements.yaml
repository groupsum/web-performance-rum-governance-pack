body: |-
  ## Requirements
  
  Source curation for web performance RUM targets MUST retain Navigation Timing, Resource Timing, User Timing, and Performance Timeline as explicit authority sources.
  
  Source curation MUST distinguish document navigation entries, resource entries, application marks and measures, and shared performance entry observation behavior.
  
  Source curation MUST NOT treat downstream implementation claims, runtime features, evidence rows, or release boundaries as part of this repository-local source authority.

