body: |-
  ## Requirements
  
  Web performance RUM source curation MUST retain separate target groupings for timing capture, performance entry observation, browser report ingestion, and beacon delivery.
  
  Curated targets MUST be source-oriented and MUST NOT assert downstream implementation conformance.
  
  Curated targets MUST be maintainable without referencing sibling governance packs or downstream repository-specific proof rows.

