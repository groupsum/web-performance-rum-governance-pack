body: |-
  ## Requirements
  
  Source curation for web performance reporting targets MUST retain Reporting API as the authority for browser report ingestion and endpoint grouping targets.
  
  Source curation MUST retain W3C Beacon API as the authority for asynchronous non-blocking telemetry delivery targets.
  
  Source curation MUST keep report ingestion targets separate from beacon delivery targets and browser timing entry targets.

